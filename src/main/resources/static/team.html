<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Member Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">📸 Team - <span id="memberName"></span></span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container" style="max-width: 900px;">

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Your Assigned Events</h5>
      <select class="form-select" id="eventSelect" onchange="loadEventDetail()">
        <option value="">-- Select an event --</option>
      </select>
    </div>
  </div>

  <div id="eventDetail" class="d-none">

    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Upload Photos</h5>
        <input type="file" class="form-control" id="fileInput" multiple accept="image/*">
        <button class="btn btn-primary mt-2" onclick="uploadFiles()">Upload</button>
        <div id="uploadStatus" class="mt-3"></div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Your Uploaded Photos <button class="btn btn-sm btn-outline-secondary float-end" onclick="loadMyPhotos()">Refresh</button></h5>
        <div class="row g-2" id="photoGrid"></div>
      </div>
    </div>

  </div>
</div>

<script>
const token = sessionStorage.getItem('token');
if (!token || sessionStorage.getItem('role') !== 'TEAM_MEMBER') {
  window.location.href = '/index.html';
}
document.getElementById('memberName').textContent = sessionStorage.getItem('name') || '';

function logout() {
  sessionStorage.clear();
  window.location.href = '/index.html';
}

function authHeaders(extra = {}) {
  return Object.assign({ 'Authorization': 'Bearer ' + token }, extra);
}

async function api(url, options = {}) {
  const res = await fetch(url, options);
  const isJson = (res.headers.get('content-type') || '').includes('application/json');
  const data = isJson ? await res.json() : null;
  if (!res.ok) throw new Error((data && data.message) || 'Request failed (' + res.status + ')');
  return data;
}

let currentEventId = null;

async function loadEvents() {
  try {
    const events = await api('/api/events', { headers: authHeaders() });
    const select = document.getElementById('eventSelect');
    select.innerHTML = '<option value="">-- Select an event --</option>';
    events.forEach(e => {
      const opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = e.name + (e.eventDate ? ' (' + e.eventDate + ')' : '');
      select.appendChild(opt);
    });
    if (events.length === 0) {
      select.innerHTML = '<option value="">No events assigned to you yet</option>';
    }
  } catch (e) {
    alert(e.message);
  }
}

function loadEventDetail() {
  const id = document.getElementById('eventSelect').value;
  currentEventId = id || null;
  document.getElementById('eventDetail').classList.toggle('d-none', !id);
  document.getElementById('uploadStatus').innerHTML = '';
  if (id) loadMyPhotos();
}

async function uploadFiles() {
  const input = document.getElementById('fileInput');
  const status = document.getElementById('uploadStatus');
  if (!input.files || input.files.length === 0) {
    status.innerHTML = '<span class="text-danger">Choose at least one file</span>';
    return;
  }
  const formData = new FormData();
  for (const file of input.files) {
    formData.append('files', file);
  }
  status.innerHTML = '<span class="text-muted">Uploading...</span>';
  try {
    const res = await fetch('/api/events/' + currentEventId + '/photos', {
      method: 'POST',
      headers: authHeaders(), // no Content-Type here - browser sets the multipart boundary itself
      body: formData
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Upload failed');

    let html = '<div class="alert alert-success">Uploaded ' + data.uploaded.length + ' photo(s).</div>';
    if (data.failed.length > 0) {
      html += '<div class="alert alert-warning">Some files failed:<ul>' +
              data.failed.map(f => '<li>' + f + '</li>').join('') + '</ul></div>';
    }
    status.innerHTML = html;
    input.value = '';
    loadMyPhotos();
  } catch (e) {
    status.innerHTML = '<span class="text-danger">' + e.message + '</span>';
  }
}

async function loadMyPhotos() {
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = '<p class="text-muted">Loading...</p>';
  try {
    const photos = await api('/api/events/' + currentEventId + '/photos', { headers: authHeaders() });
    grid.innerHTML = '';
    if (photos.length === 0) {
      grid.innerHTML = '<p class="text-muted">You have not uploaded any photos to this event yet.</p>';
      return;
    }
    photos.forEach(p => {
      const col = document.createElement('div');
      col.className = 'col-6 col-md-3';
      col.innerHTML = `
        <div class="card">
          <img src="${p.storageUrl}" class="card-img-top" style="height:120px; object-fit:cover;">
          <div class="card-body p-2">
            <small class="text-muted">${p.filename}</small>
          </div>
        </div>`;
      grid.appendChild(col);
    });
  } catch (e) {
    grid.innerHTML = '<span class="text-danger">' + e.message + '</span>';
  }
}

loadEvents();
</script>
</body>
</html>
