<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">📸 Admin - <span id="adminName"></span></span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container" style="max-width: 900px;">

  <!-- Create event -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Create Event</h5>
      <div class="row g-2">
        <div class="col-md-6"><input class="form-control" id="eventName" placeholder="Event name (e.g. Arjun & Priya Wedding)"></div>
        <div class="col-md-4"><input type="date" class="form-control" id="eventDate"></div>
		<div class="col-md-2"><button class="btn btn-primary w-100" onclick="submitNewEvent()">Create</button></div>
      </div>
      <div id="eventMsg" class="mt-2"></div>
    </div>
  </div>

  <!-- Event selector -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Your Events</h5>
      <select class="form-select" id="eventSelect" onchange="loadEventDetail()">
        <option value="">-- Select an event --</option>
      </select>
    </div>
  </div>

  <div id="eventDetail" class="d-none">

    <!-- Add member -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Add Team Member</h5>
        <div class="row g-2">
          <div class="col-md-4"><input class="form-control" id="memberName" placeholder="Name"></div>
          <div class="col-md-4"><input class="form-control" id="memberEmail" placeholder="Email"></div>
          <div class="col-md-3"><input class="form-control" id="memberPass" placeholder="Temp password"></div>
          <div class="col-md-1"><button class="btn btn-success w-100" onclick="addMember()">+</button></div>
        </div>
        <div id="memberMsg" class="mt-2"></div>
        <ul class="list-group mt-2" id="memberList"></ul>
      </div>
    </div>

    <!-- Photos -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Photos <button class="btn btn-sm btn-outline-secondary float-end" onclick="loadPhotos()">Refresh</button></h5>
        <p class="text-muted small">Tick the photos you want in the published gallery.</p>
        <div class="row g-2" id="photoGrid"></div>
      </div>
    </div>

    <!-- Publish -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Publish Gallery</h5>
        <button class="btn btn-warning" onclick="publishGallery()">Publish Selected Photos</button>
        <div id="publishResult" class="mt-3"></div>
      </div>
    </div>

  </div>
</div>

<script>
const token = sessionStorage.getItem('token');
if (!token || sessionStorage.getItem('role') !== 'ADMIN') {
  window.location.href = '/index.html';
}
document.getElementById('adminName').textContent = sessionStorage.getItem('name') || '';

function logout() {
  sessionStorage.clear();
  window.location.href = '/index.html';
}

function authHeaders(extra = {}) {
  return Object.assign({ 'Authorization': 'Bearer ' + token }, extra);
}

async function api(url, options = {}) {
  const res = await fetch(url, options);
  const isJson = (res.headers.get('content-type') || '').includes('application/json');
  const data = isJson ? await res.json() : null;
  if (!res.ok) throw new Error((data && data.message) || 'Request failed (' + res.status + ')');
  return data;
}

let currentEventId = null;

async function loadEvents() {
  try {
    const events = await api('/api/events', { headers: authHeaders() });
    const select = document.getElementById('eventSelect');
    select.innerHTML = '<option value="">-- Select an event --</option>';
    events.forEach(e => {
      const opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = e.name + (e.eventDate ? ' (' + e.eventDate + ')' : '');
      select.appendChild(opt);
    });
  } catch (e) {
    alert(e.message);
  }
}

async function submitNewEvent() {
  const name = document.getElementById('eventName').value.trim();
  const eventDate = document.getElementById('eventDate').value || null;
  const msg = document.getElementById('eventMsg');
  if (!name) { msg.innerHTML = '<span class="text-danger">Name is required</span>'; return; }
  try {
    await api('/api/events', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ name, eventDate })
    });
    msg.innerHTML = '<span class="text-success">Event created</span>';
    document.getElementById('eventName').value = '';
    loadEvents();
  } catch (e) {
    msg.innerHTML = '<span class="text-danger">' + e.message + '</span>';
  }
}

function loadEventDetail() {
  const id = document.getElementById('eventSelect').value;
  currentEventId = id || null;
  document.getElementById('eventDetail').classList.toggle('d-none', !id);
  document.getElementById('publishResult').innerHTML = '';
  if (id) { loadMembers(); loadPhotos(); }
}

async function loadMembers() {
  try {
    const members = await api('/api/events/' + currentEventId + '/members', { headers: authHeaders() });
    const list = document.getElementById('memberList');
    list.innerHTML = '';
    members.forEach(m => {
      const li = document.createElement('li');
      li.className = 'list-group-item';
      li.textContent = m.name + ' (' + m.email + ')';
      list.appendChild(li);
    });
  } catch (e) {
    document.getElementById('memberMsg').innerHTML = '<span class="text-danger">' + e.message + '</span>';
  }
}

async function addMember() {
  const name = document.getElementById('memberName').value.trim();
  const email = document.getElementById('memberEmail').value.trim();
  const temporaryPassword = document.getElementById('memberPass').value;
  const msg = document.getElementById('memberMsg');
  if (!name || !email || !temporaryPassword) { msg.innerHTML = '<span class="text-danger">All fields required</span>'; return; }
  try {
    await api('/api/events/' + currentEventId + '/members', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ name, email, temporaryPassword })
    });
    msg.innerHTML = '<span class="text-success">Member added</span>';
    document.getElementById('memberName').value = '';
    document.getElementById('memberEmail').value = '';
    document.getElementById('memberPass').value = '';
    loadMembers();
  } catch (e) {
    msg.innerHTML = '<span class="text-danger">' + e.message + '</span>';
  }
}

async function loadPhotos() {
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = '<p class="text-muted">Loading...</p>';
  try {
    const photos = await api('/api/events/' + currentEventId + '/photos', { headers: authHeaders() });
    grid.innerHTML = '';
    if (photos.length === 0) {
      grid.innerHTML = '<p class="text-muted">No photos uploaded yet for this event.</p>';
      return;
    }
    photos.forEach(p => {
      const col = document.createElement('div');
      col.className = 'col-6 col-md-3';
      col.innerHTML = `
        <div class="form-check">
          <input class="form-check-input photo-check" type="checkbox" value="${p.id}" id="photo${p.id}">
          <label class="form-check-label" for="photo${p.id}">
            <img src="${p.storageUrl}" class="img-fluid rounded" style="max-height:120px; object-fit:cover; width:100%;">
          </label>
        </div>`;
      grid.appendChild(col);
    });
  } catch (e) {
    grid.innerHTML = '<span class="text-danger">' + e.message + '</span>';
  }
}

async function publishGallery() {
  const checked = Array.from(document.querySelectorAll('.photo-check:checked')).map(c => Number(c.value));
  const result = document.getElementById('publishResult');
  if (checked.length === 0) { result.innerHTML = '<span class="text-danger">Select at least one photo</span>'; return; }
  try {
    const res = await api('/api/events/' + currentEventId + '/gallery/publish', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ photoIds: checked })
    });
    result.innerHTML = `
      <div class="alert alert-success">
        <strong>Gallery published!</strong><br>
        Link: <a href="${res.galleryUrl}" target="_blank">${res.galleryUrl}</a><br>
        PIN: <strong>${res.pin}</strong> <span class="text-muted">(shown once - save it now)</span><br>
        Photos published: ${res.photoCount}
      </div>`;
  } catch (e) {
    result.innerHTML = '<span class="text-danger">' + e.message + '</span>';
  }
}

loadEvents();
</script>
</body>
</html>
