<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Sharing Platform - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 80px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-3 text-center">📸 Photo Sharing Platform</h4>

      <ul class="nav nav-tabs mb-3" id="authTabs">
        <li class="nav-item"><button class="nav-link active" id="loginTab" onclick="showTab('login')">Login</button></li>
        <li class="nav-item"><button class="nav-link" id="registerTab" onclick="showTab('register')">Register as Admin</button></li>
      </ul>

      <div id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword">
        </div>
        <button class="btn btn-primary w-100" onclick="login()">Login</button>
      </div>

      <div id="registerForm" class="d-none">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" id="regName">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="regEmail">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="regPassword" placeholder="At least 8 characters">
        </div>
        <button class="btn btn-success w-100" onclick="register()">Register</button>
      </div>

      <div id="errorBox" class="alert alert-danger mt-3 d-none"></div>
    </div>
  </div>
  <p class="text-center text-muted mt-3" style="font-size: 0.85rem;">
    Customer with a gallery link? <a href="/gallery.html">Open your gallery</a>
  </p>
</div>

<script>
function showTab(which) {
  document.getElementById('loginForm').classList.toggle('d-none', which !== 'login');
  document.getElementById('registerForm').classList.toggle('d-none', which !== 'register');
  document.getElementById('loginTab').classList.toggle('active', which === 'login');
  document.getElementById('registerTab').classList.toggle('active', which === 'register');
  hideError();
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.remove('d-none');
}
function hideError() {
  document.getElementById('errorBox').classList.add('d-none');
}

async function login() {
  hideError();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return showError('Please enter email and password');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) return showError(data.message || 'Login failed');
    afterAuth(data);
  } catch (e) {
    showError('Could not reach the server');
  }
}

async function register() {
  hideError();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) return showError('Please fill in all fields');

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (!res.ok) return showError(data.message || 'Registration failed');
    afterAuth(data);
  } catch (e) {
    showError('Could not reach the server');
  }
}

function afterAuth(data) {
  sessionStorage.setItem('token', data.token);
  sessionStorage.setItem('role', data.role);
  sessionStorage.setItem('name', data.name);
  window.location.href = data.role === 'ADMIN' ? '/admin.html' : '/team.html';
}
</script>
</body>
</html>
