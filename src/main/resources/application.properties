spring.application.name=photoshare

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/photoshare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

app.jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-1234}
app.jwt.expiration-ms=86400000
app.base-url=${APP_BASE_URL:http://localhost:8080}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}